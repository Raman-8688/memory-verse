<div class="layout-container">
  <mv-navbar class="layout-navbar"></mv-navbar>
  <div class="layout-body">
    <!-- Desktop Sidebar -->
    <div class="desktop-sidebar-wrapper" [class.collapsed]="sidebarService.isCollapsed()">
      <mv-sidebar></mv-sidebar>
    </div>

    <!-- Mobile/Tablet Sidebar Drawer & Backdrop -->
    @if (sidebarService.isMobileOpen()) {
      <div class="mobile-sidebar-backdrop" (click)="sidebarService.closeMobile()" role="presentation"></div>
      <aside class="mobile-sidebar-drawer" role="dialog" aria-label="Navigation Menu">
        <mv-sidebar (navigated)="sidebarService.closeMobile()"></mv-sidebar>
      </aside>
    }

    <main class="layout-main-content route-fade-in">
      <router-outlet></router-outlet>
    </main>
  </div>
  <mv-mobile-nav></mv-mobile-nav>
  <mv-command-palette></mv-command-palette>
  <mv-moment-fab></mv-moment-fab>
</div>
