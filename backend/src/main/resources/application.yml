spring:
  application:
    name: memory-verse
  config:
    import:
      - optional:classpath:application-secrets.yml
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  ai:
    openai:
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
      api-key: ${NVIDIA_API_KEY:nvapi-placeholder-key}
      chat:
        options:
          model: ${NVIDIA_MODEL:meta/llama-3.2-11b-vision-instruct}
          temperature: 0.2
          max-tokens: 2048

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:placeholder-cloud-name}
    api-key: ${CLOUDINARY_API_KEY:placeholder-api-key}
    api-secret: ${CLOUDINARY_API_SECRET:placeholder-api-secret}
  seed-local-media: ${SEED_LOCAL_MEDIA:false}
